name: Build AirShare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Build release APK (optional)
        continue-on-error: true
        run: gradle --no-daemon :app:assembleRelease
      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/AirShare-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/AirShare-release.apk || true
      - uses: actions/upload-artifact@v4
        with: { name: AirShare-apks, path: out/ }
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: airshare-build-${{ github.run_number }}
          name: AirShare build ${{ github.run_number }}
          files: out/*.apk
